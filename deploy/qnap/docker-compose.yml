services:
  nk-cars-buying-browser:
    container_name: tony-nk-cars-buying-browser
    build:
      context: ../..
      dockerfile: deploy/qnap/Dockerfile
    image: tony-nk-cars-buying-browser:f018cd5
    restart: unless-stopped
    ports:
      - "192.168.0.132:4330:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Bangkok
      WRANGLER_LOG_PATH: .wrangler/wrangler.log
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - nk-cars-buying-browser-lan

networks:
  nk-cars-buying-browser-lan:
    name: nk-cars-buying-browser-lan
